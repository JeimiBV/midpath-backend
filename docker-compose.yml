version: '3.8'

services:
  db:
    image: postgres:latest
    container_name: midpath_db
    environment:
      POSTGRES_DB: notes_db
      POSTGRES_USER: midpath
      POSTGRES_PASSWORD: midpath
    ports:
      - "5438:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U midpath -d notes_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
